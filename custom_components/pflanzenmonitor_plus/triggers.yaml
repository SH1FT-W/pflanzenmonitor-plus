# Erzeugt passend zu trigger.py/condition.py; Ziel sind die Zustands-Entitäten der Pflanzen.

problem_detected:
  target:
    entity:
      - integration: pflanzenmonitor_plus
        domain: sensor
        device_class: enum
  fields:
    behavior:
      required: true
      default: each
      selector:
        automation_behavior:
          mode: trigger
    for:
      required: true
      default: 00:00:00
      selector:
        duration:


# Erzeugt passend zu trigger.py/condition.py; Ziel sind die Zustands-Entitäten der Pflanzen.

has_problem:
  target:
    entity:
      - integration: pflanzenmonitor_plus
        domain: sensor
        device_class: enum
  fields:
    behavior:
      required: true
      default: any
      selector:
        automation_behavior:
          mode: condition
    for:
      required: true
      default: 00:00:00
      selector:
        duration:


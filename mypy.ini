# Typprüfung: uvx mypy@2.3.1 --python-executable ~/Software/evenlight/.venv/bin/python (HA kommt aus der evenlight-venv)
[mypy]
python_version = 3.14
files = custom_components/pflanzenmonitor_plus
# Platin der Integration Quality Scale: strict typing
strict = true
show_error_codes = true

# HA-Pakete exportieren Teile ihrer Schnittstelle ohne `as`
[mypy-homeassistant.*]
implicit_reexport = true
